# FreeXHT: sway as the compositor of the box. No bar, no borders, no key bindings: every key goes
# to the interface. Two windows, both floating over the whole screen:
#
#   freexht-video    mpv, at the bottom, never focused
#   com.igalia.Cog   the FreeX TV interface (cog), on top, transparent while a video plays
#
# The session itself is freexht-agent (exec at the end); it starts mpv and cog.

xwayland disable

default_border none
default_floating_border none
titlebar_border_thickness 0
titlebar_padding 0
hide_edge_borders both
floating_maximum_size -1 x -1
focus_follows_mouse no
focus_on_window_activation none
mouse_warping none
seat * hide_cursor 3000

input type:keyboard {
    repeat_delay 400
    repeat_rate 20
}

for_window [app_id="freexht-video"] floating enable, resize set width 100 ppt height 100 ppt, move absolute position 0 0
for_window [app_id="com.igalia.Cog"] floating enable, resize set width 100 ppt height 100 ppt, move absolute position 0 0, focus
no_focus [app_id="freexht-video"]

exec /usr/lib/freexht/freexht-agent

# Settings of your own (e.g. "output HDMI-A-1 scale 1.5"); the file is optional.
include /etc/freexht/sway.d/*
