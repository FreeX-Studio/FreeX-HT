# FreeXHT settings
#
# This file is on the boot partition (FREEXHT) and can be edited on any computer after flashing
# the image, before the first start. Lines are "key = value"; "#" starts a comment. Empty values
# keep the default. Changes apply at the next start.

# --- Network -------------------------------------------------------------------------------
# Wi-Fi network (not needed with a network cable). The password is stored on the box at the
# next start and then removed from this file.
wifi_ssid =
wifi_password =
# Two-letter country code for Wi-Fi channels, e.g. DE, AT, CH, US.
wifi_country = DE

# Name of the box in the network (letters, digits and "-").
hostname = freexht

# --- FreeX -------------------------------------------------------------------------------
# Address of your FreeX Media Server, e.g. 192.168.1.10 or media.example.org (port 32500 when
# none is given). Without it the box asks on the screen.
server =

# Name of the box in the server's activity view (default: "FreeXHT <hostname>").
device_name =

# --- System -------------------------------------------------------------------------------
# Time zone, e.g. Europe/Berlin.
timezone = Europe/Berlin

# SSH: with a public key here, SSH is switched on and root can log in with that key.
ssh_authorized_key =

# Keyboard layout of a USB keyboard (de, us, fr, ...).
keyboard_layout = de

# --- Picture and sound (usually leave empty) -----------------------------------------------
# Screen mode: auto (the TV's preferred mode), 1080p, 2160p, 720p or e.g. 1920x1080@50.
# Default: 1080p on a Raspberry Pi, auto on a PC.
display_mode =

# Sound the TV or receiver decodes itself (HDMI passthrough), e.g. ac3,eac3,dts.
audio_passthrough =

# mpv's audio device, e.g. alsa/hdmi:CARD=vc4hdmi1,DEV=0 for the second HDMI port of a Pi 4.
audio_device =

# mpv's hardware decoding (default depends on the board) and video output (default: gpu).
hwdec =
video_output =

# Codecs the server may send without converting, e.g. h264,hevc (default depends on the board).
video_codecs =

# Name on HDMI-CEC (shown in the TV's source list).
cec_name = FreeXHT

# More mpv settings: put an mpv.conf next to this file.
