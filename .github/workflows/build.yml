#
# The build of FreeXHT: the tests and the package freexht (Architecture: all) on every push, and
# the system images for the Raspberry Pi (arm64, on an arm64 runner) and x86_64 PCs for releases
# or when started by hand (Actions > Build > Run workflow, "images"). The images are built in a
# Debian 13 container. A tag v* (made by the Release workflow) publishes the package and the
# images as a GitHub release and the package in the MirraNET APT repository, from which the boxes
# update themselves.
#
# Secrets (organization): APT_HOST, APT_PORT, APT_REPO, APT_SSH_KEY and APT_KNOWN_HOSTS for the
# apt job (skipped without them).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: "Also build the system images (Raspberry Pi and x86_64, about 20 minutes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: FreeX TV interface (FreeX-TV-Apps)
        run: |
          git clone -q --depth 1 https://github.com/FreeX-Studio/FreeX-TV-Apps.git build/tv-apps
          echo "FreeX TV interface: $(git -C build/tv-apps log -1 --format='%h %s')"
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Package
        id: package
        run: |
          VERSION="$(cat VERSION)"
          # A release has the plain version; other builds one of their own (newer than the one before).
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            DEB_VERSION="$VERSION"
          else
            DEB_VERSION="$VERSION+$(date -u +%Y%m%d%H%M).git${GITHUB_SHA::7}"
          fi
          packaging/build-deb.sh "$DEB_VERSION" build/tv-apps/web dist
          echo "version=$DEB_VERSION" >> "$GITHUB_OUTPUT"
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: dist/*.deb
          if-no-files-found: error

  images:
    # Releases (tags) and builds started by hand with "images".
    if: github.ref_type == 'tag' || inputs.images
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rpi
            runner: ubuntu-24.04-arm   # arm64 natively, no qemu
          - target: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: package
          merge-multiple: true
      - name: Free disk space
        # An image needs about 4 GB while it is built; the runners come with toolchains we don't use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"
      - name: System image
        # Debian 13 (mke2fs reading tarballs, apt with sqv, the current
        # archive keys). Privileged and as root: mmdebstrap runs in root mode, no user namespace.
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p images build
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/src" -w /src \
              -e TARGET -e VERSION -e WORK_DIR=/src/build/work debian:trixie bash -euc '
                  apt-get update -qq
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                      mmdebstrap e2fsprogs libarchive13t64 dosfstools mtools fdisk xz-utils gpg curl \
                      ca-certificates dpkg-dev debian-archive-keyring >/dev/null
                  image/build-image.sh "$TARGET" "$VERSION" dist/freexht_*.deb images
                  rm -rf build/work
                  chown -R '"$(id -u):$(id -g)"' images'
          ls -l images
      - uses: actions/upload-artifact@v6
        with:
          name: image-${{ matrix.target }}
          path: images/*
          compression-level: 0   # already xz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [package, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # The release notes: this version's section of the changelog.
          awk -v v="## FreeXHT ${TAG#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\nWrite FreeXHT-*-rpi.img.xz (Raspberry Pi 3/4/5) or FreeXHT-*-x86_64.img.xz (UEFI PCs) to an SD card or disk. Installed boxes get the package from the APT repository apt.mirranet.de on their own.\n' >> notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "FreeXHT ${TAG#v}" \
              --notes-file notes.md --verify-tag

  apt:
    # Publish the release .deb to the MirraNET APT repository (apt.mirranet.de).
    # reprepro and the signing key live on the server; skipped when the deploy
    # secrets are not configured.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: package
          merge-multiple: true
      - name: Publish to APT repository
        env:
          APT_HOST: ${{ secrets.APT_HOST }}
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_KNOWN_HOSTS: ${{ secrets.APT_KNOWN_HOSTS }}
          APT_REPO: ${{ secrets.APT_REPO }}
          APT_PORT: ${{ secrets.APT_PORT }}
          APT_SUITE: stable
        run: |
          if [ -z "${APT_HOST:-}" ]; then
            echo "::notice::APT deploy secrets not set; skipping APT publish."
            exit 0
          fi
          mkdir -p debs
          find dist -name '*.deb' -exec cp {} debs/ \;
          if ! ls debs/*.deb >/dev/null 2>&1; then echo "::error::no .deb found in artifacts"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$APT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opt="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o Port=${APT_PORT:-22} -i $HOME/.ssh/id_deploy"
          tmp=$(ssh $opt "$APT_HOST" mktemp -d)
          scp $opt -q packaging/apt/publish.sh debs/*.deb "$APT_HOST:$tmp/"
          ssh $opt "$APT_HOST" bash -s -- "$tmp" "$APT_REPO" "$APT_SUITE" <<'EOF'
          rc=0
          bash "$1/publish.sh" "$2" "$3" "$1"/*.deb || rc=$?
          rm -rf "$1"
          exit $rc
          EOF
